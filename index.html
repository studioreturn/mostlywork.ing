<script>
  (function () {
    var host = location.hostname;
    var ua = navigator.userAgent;
    var isFirefox = /Firefox\//.test(ua);
    var isSafari = /^((?!Chrome|Chromium|Edg|Android).)*Safari/.test(ua);
    var keepTrailingSlash = isFirefox || isSafari;
    document.title = keepTrailingSlash ? host + "/" : host;
  })();
</script>
